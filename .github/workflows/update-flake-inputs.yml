name: Update Flake Inputs

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://cache.numtide.com https://ai-tools.cachix.org
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= ai-tools.cachix.org-1:4hlOyu6MVh7DhTl3dG4u1zlyhD834yElTL8bnPu4z2M=

      - name: Update flake inputs
        run: nix flake update --accept-flake-config

      - name: Open PR if inputs changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update flake inputs"
          branch: "chore/update-flake-inputs"
          delete-branch: true
          title: "chore: update flake inputs"
          body: |
            Automated weekly update of `flake.lock` via `nix flake update`.

            Review the diff, run CI, and merge if everything looks good.
          labels: "dependencies,nix"
