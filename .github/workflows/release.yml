name: Release

on:
  push:
    tags:
      - v*.*.*

jobs:
  build-and-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://cache.numtide.com https://ai-tools.cachix.org
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= ai-tools.cachix.org-1:4hlOyu6MVh7DhTl3dG4u1zlyhD834yElTL8bnPu4z2M=

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: ai-tools

      - name: Build release target
        run: |
          nix build \
            .#checks.x86_64-linux.default \
            .#packages.x86_64-linux.default \
            .#packages.x86_64-linux.mcp \
            .#devShells.x86_64-linux.default \
            --accept-flake-config \
            --print-build-logs

  github-release:
    needs: build-and-cache
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag
