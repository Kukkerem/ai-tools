name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-cache:
    name: Build and cache
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://cache.numtide.com https://ai-tools.cachix.org
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= ai-tools.cachix.org-1:4hlOyu6MVh7DhTl3dG4u1zlyhD834yElTL8bnPu4z2M=

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: ai-tools
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build and push release outputs
        id: build
        run: |
          store_path=$(nix build \
            .#checks.x86_64-linux.default \
            .#packages.x86_64-linux.default \
            .#packages.x86_64-linux.mcp \
            .#devShells.x86_64-linux.default \
            --no-link --print-out-paths \
            --accept-flake-config \
            --print-build-logs \
            | tee /tmp/store_paths.txt \
            | tail -1)
          echo "store_path=$store_path" >> "$GITHUB_OUTPUT"
          # Explicitly push all built paths so the pin step can find them
          cachix push ai-tools < /tmp/store_paths.txt

      - name: Pin release output in Cachix
        run: |
          version="${GITHUB_REF_NAME#v}"
          cachix pin ai-tools "ai-tools-${version}" "${{ steps.build.outputs.store_path }}"

  github-release:
    name: GitHub release
    needs: build-and-cache
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: /tmp/RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/RELEASE_NOTES.md \
            --verify-tag
