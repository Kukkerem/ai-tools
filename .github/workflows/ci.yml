name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://cache.numtide.com https://ai-tools.cachix.org
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= ai-tools.cachix.org-1:4hlOyu6MVh7DhTl3dG4u1zlyhD834yElTL8bnPu4z2M=

      - name: Check formatting
        run: |
          nix fmt --accept-flake-config
          git diff --exit-code

  check:
    needs: format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://cache.numtide.com https://ai-tools.cachix.org
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= ai-tools.cachix.org-1:4hlOyu6MVh7DhTl3dG4u1zlyhD834yElTL8bnPu4z2M=

      - name: Configure Cachix
        if: github.event_name != 'pull_request'
        uses: cachix/cachix-action@v17
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: ai-tools

      - name: Run flake checks
        run: nix flake check --accept-flake-config --print-build-logs

      - name: Build reusable outputs
        if: github.event_name != 'pull_request'
        run: |
          nix build \
            .#packages.x86_64-linux.default \
            .#packages.x86_64-linux.mcp \
            .#devShells.x86_64-linux.default \
            --accept-flake-config \
            --print-build-logs
