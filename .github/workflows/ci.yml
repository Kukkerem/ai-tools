name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://cache.numtide.com https://ai-tools.cachix.org
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= ai-tools.cachix.org-1:4hlOyu6MVh7DhTl3dG4u1zlyhD834yElTL8bnPu4z2M=

      - name: Check formatting
        run: |
          nix fmt --accept-flake-config
          git diff --exit-code

  check:
    name: Flake check
    needs: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://cache.numtide.com https://ai-tools.cachix.org
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= ai-tools.cachix.org-1:4hlOyu6MVh7DhTl3dG4u1zlyhD834yElTL8bnPu4z2M=

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: ai-tools
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Only push to Cachix on main branch pushes (not PRs, not tags — tags handled by release.yml)
          skipPush: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') }}

      - name: Run flake checks
        run: nix flake check --accept-flake-config --print-build-logs

      - name: Build and cache reusable outputs
        id: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          store_path=$(nix build \
            .#packages.x86_64-linux.default \
            .#packages.x86_64-linux.mcp \
            .#devShells.x86_64-linux.default \
            --no-link --print-out-paths \
            --accept-flake-config \
            --print-build-logs \
            | tee /tmp/store_paths.txt \
            | tail -1)
          echo "store_path=$store_path" >> "$GITHUB_OUTPUT"
          # Explicitly push all built paths so the pin step can find them
          cachix push ai-tools < /tmp/store_paths.txt

      - name: Pin latest output to Cachix
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cachix pin ai-tools ai-tools-latest "${{ steps.build.outputs.store_path }}" --keep-revisions 1
